<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artsake | Sales Assets & File Repository</title>
  <style>
    :root {
      --bg: #FAFAFA;
      --card-bg: #FFFFFF;
      --text-main: #111111;
      --text-muted: #666666;
      --border: #E8E8E8;
      --accent-orange: #FF3B1D;
      --hover-bg: #F5F5F5;
      --badge-pdf-bg: #FFF0ED;
      --badge-pdf-txt: #D32F2F;
      --badge-link-bg: #E3F2FD;
      --badge-link-txt: #1976D2;
      --badge-img-bg: #F3E5F5;
      --badge-img-txt: #7B1FA2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding: 40px 20px;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
    }

    /* Artsake Header with real logo */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .logo-container {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo-img {
      height: 38px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .header-tag {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      background: #F0F0F0;
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--text-main);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
      fill: none;
    }

    /* Main Repository Card */
    .repo-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
    }

    .repo-header {
      padding: 16px 24px;
      background: #FAFAFA;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 14px;
    }

    .folder-tree {
      list-style: none;
    }

    .tree-item {
      border-bottom: 1px solid var(--border);
    }

    .tree-item:last-child {
      border-bottom: none;
    }

    .item-row {
      display: flex;
      align-items: center;
      padding: 14px 24px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s ease;
    }

    .item-row:hover {
      background-color: var(--hover-bg);
    }

    .item-indent {
      display: inline-block;
    }

    .chevron {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      transition: transform 0.2s;
      stroke: var(--text-muted);
      fill: none;
    }

    .chevron.expanded {
      transform: rotate(90deg);
    }

    .icon-wrapper {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item-title {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-pdf { background: var(--badge-pdf-bg); color: var(--badge-pdf-txt); }
    .badge-link { background: var(--badge-link-bg); color: var(--badge-link-txt); }
    .badge-img { background: var(--badge-img-bg); color: var(--badge-img-txt); }
    .badge-folder { background: #E2E8F0; color: #475569; }

    .action-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .action-btn:hover {
      border-color: var(--text-main);
      background: var(--text-main);
      color: #FFFFFF;
    }

    .children-container {
      display: none;
      background-color: #FCFCFC;
    }

    .children-container.open {
      display: block;
    }

    footer {
      margin-top: 32px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header using Real Logo Image -->
  <header>
    <a href="https://files.artsake.com" class="logo-container">
      <img src="logo.avif" alt="Artsake Logo" class="logo-img">
    </a>
    <span class="header-tag">files.artsake.com</span>
  </header>

  <!-- Search Bar -->
  <div class="controls-bar">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Search presentations, proposals, look books, or assets...">
    </div>
  </div>

  <!-- Repository File Card -->
  <div class="repo-card">
    <div class="repo-header">
      <span>File / Directory Structure</span>
      <span>Action</span>
    </div>

    <ul class="folder-tree" id="treeRoot"></ul>
  </div>

  <footer>
    &copy; Artsake Inc. Internal Sales Repository & Client Presentation Vault.
  </footer>
</div>

<script>
  // Exact folder & file structure matching GitHub main branch
  const repositoryData = [
    {
      name: "Root Quick Access",
      type: "folder",
      expanded: true,
      children: [
        { name: "LookBook.pdf", type: "pdf", url: "LookBook.pdf" },
        { name: "WelcomeDeck.pdf", type: "pdf", url: "WelcomeDeck.pdf" }
      ]
    },
    {
      name: "2026",
      type: "folder",
      expanded: true,
      children: [
        { name: "Artsake 2026 Accordion Look Book.pdf", type: "pdf", url: "2026/Artsake%202026%20Accordion%20Look%20Book.pdf" },
        { name: "Artsake 2026 B2B Look Book.pdf", type: "pdf", url: "2026/Artsake%202026%20B2B%20Look%20Book.pdf" },
        { name: "Artsake 2026 B2B Welcome Deck.pdf", type: "pdf", url: "2026/Artsake%202026%20B2B%20Welcome%20Deck.pdf" },
        { name: "Artsake 2026 BDNY Assets.pdf", type: "pdf", url: "2026/Artsake%202026%20BDNY%20Assets.pdf" },
        { name: "Artsake 2026 Book Box.pdf", type: "pdf", url: "2026/Artsake%202026%20Book%20Box.pdf" },
        { name: "Artsake 2026 Coloring Book.pdf", type: "pdf", url: "2026/Artsake%202026%20Coloring%20Book.pdf" },
        { name: "Artsake 2026 Trade Pricing.pdf", type: "pdf", url: "2026/Artsake%202026%20Trade%20Pricing.pdf" },
        { name: "Artsake 2026 Welcome Book.pdf", type: "pdf", url: "2026/Artsake%202026%20Welcome%20Book.pdf" },
        { name: "Artsake - Look Book URL", type: "link", url: "2026/Artsake%202026%20B2B%20Look%20Book.pdf" },
        { name: "Artsake - Welcome Deck", type: "link", url: "2026/Artsake%202026%20B2B%20Welcome%20Deck.pdf" },
        { name: "Artsake - For The Love of Art (artsake.com)", type: "link", url: "https://artsake.com" },
        { name: "Map of Tomorrow | Interactive Development Map", type: "link", url: "#" },
        { name: "LookBook.pdf", type: "pdf", url: "2026/LookBook.pdf" },
        { name: "WelcomeDeck.pdf", type: "pdf", url: "2026/WelcomeDeck.pdf" }
      ]
    },
    {
      name: "examples",
      type: "folder",
      expanded: true,
      children: [
        { name: "Artsake x Renaissance OTT - Artwork Pre-Selection_v.1.pdf", type: "pdf", url: "examples/Artsake%20x%20Renaissance%20OTT%20-%20Artwork%20Pre-Selection_v.1.pdf" },
        { name: "Artsake x MED2 Proposal_v.1.pdf", type: "pdf", url: "examples/Artsake%20x%20MED2%20Proposal_v.1.pdf" },
        { name: "Artsake x Royalton Presentation_v.1.pdf", type: "pdf", url: "examples/Artsake%20x%20Royalton%20Presentation_v.1.pdf" },
        { name: "Artsake x Moxy Montreal Suites and Lobby_v.1.pdf", type: "pdf", url: "examples/Artsake%20x%20Moxy%20Montreal%20Suites%20and%20Lobby_v.1.pdf" },
        { name: "Artsake x Ardene HQ_v.1.pdf", type: "pdf", url: "examples/Artsake%20x%20Ardene%20HQ_v.1.pdf" },
        {
          name: "files",
          type: "folder",
          expanded: false,
          children: [
            { name: "0AB04B0C-7F6E-4F34-9220-B0B196A22A6C.png", type: "img", url: "examples/files/0AB04B0C-7F6E-4F34-9220-B0B196A22A6C.png" },
            { name: "63AB5FD8-DF38-4F86-A523-00BB8D281721.png", type: "img", url: "examples/files/63AB5FD8-DF38-4F86-A523-00BB8D281721.png" },
            { name: "AB2EAF1E-6DA9-4A04-9751-473DE9F873FD.png", type: "img", url: "examples/files/AB2EAF1E-6DA9-4A04-9751-473DE9F873FD.png" },
            { name: "Artsake Wall Art Proposal - Moxy Montreal v.Final.pdf", type: "pdf", url: "examples/files/Artsake%20Wall%20Art%20Proposal%20-%20Moxy%20Montreal%20v.Final%20(dragged).pdf" }
          ]
        }
      ]
    }
  ];

  // Icons
  const icons = {
    folder: `<svg width="18" height="18" viewBox="0 0 24 24" fill="#64748B"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>`,
    pdf: `<svg width="18" height="18" viewBox="0 0 24 24" fill="#D32F2F"><path d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v2H7.5V7H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2.5V7H15c.83 0 1.5.67 1.5 1.5v3zm4-3H19v1h1.5V11H19v2h-1.5V7h3v1.5z"/></svg>`,
    link: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1976D2" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>`,
    img: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7B1FA2" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
    chevron: `<svg class="chevron" viewBox="0 0 24 24" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>`
  };

  function renderTree(nodes, container, depth = 0) {
    nodes.forEach(node => {
      const li = document.createElement('li');
      li.className = 'tree-item';

      const row = document.createElement('div');
      row.className = 'item-row';
      
      const indent = depth * 20;
      
      let chevronHtml = node.type === 'folder' 
        ? `<span class="${node.expanded ? 'chevron expanded' : 'chevron'}">${icons.chevron}</span>` 
        : `<span style="width:24px; display:inline-block;"></span>`;

      let badgeClass = 'badge-folder';
      let actionLabel = 'Expand';
      
      if (node.type === 'pdf') { badgeClass = 'badge-pdf'; actionLabel = 'Open PDF'; }
      if (node.type === 'link') { badgeClass = 'badge-link'; actionLabel = 'Open Link'; }
      if (node.type === 'img') { badgeClass = 'badge-img'; actionLabel = 'View Asset'; }

      row.innerHTML = `
        <div style="padding-left: ${indent}px;" class="item-indent"></div>
        ${chevronHtml}
        <div class="icon-wrapper">${icons[node.type] || icons.pdf}</div>
        <span class="item-title">${node.name}</span>
        <div class="item-actions">
          <span class="badge ${badgeClass}">${node.type}</span>
          ${node.type !== 'folder' 
            ? `<a href="${node.url}" target="_blank" class="action-btn">${actionLabel}</a>` 
            : `<button class="action-btn">Folder</button>`
          }
        </div>
      `;

      li.appendChild(row);

      if (node.type === 'folder' && node.children) {
        const childUl = document.createElement('ul');
        childUl.className = `children-container ${node.expanded ? 'open' : ''}`;
        renderTree(node.children, childUl, depth + 1);
        li.appendChild(childUl);

        row.addEventListener('click', (e) => {
          if (e.target.tagName === 'A') return;
          const isOpen = childUl.classList.contains('open');
          childUl.classList.toggle('open', !isOpen);
          const chev = row.querySelector('.chevron');
          if (chev) chev.classList.toggle('expanded', !isOpen);
        });
      }

      container.appendChild(li);
    });
  }

  // Initialize
  const treeRoot = document.getElementById('treeRoot');
  renderTree(repositoryData, treeRoot);

  // Instant Search
  document.getElementById('searchInput').addEventListener('input', function(e) {
    const query = e.target.value.toLowerCase().trim();
    const rows = document.querySelectorAll('.tree-item');

    rows.forEach(item => {
      const title = item.querySelector('.item-title')?.textContent.toLowerCase();
      if (!query) {
        item.style.display = '';
      } else if (title && title.includes(query)) {
        item.style.display = '';
        let parent = item.parentElement;
        while (parent && parent.classList.contains('children-container')) {
          parent.classList.add('open');
          parent = parent.parentElement.parentElement;
        }
      } else if (!item.querySelector('.children-container')) {
        item.style.display = 'none';
      }
    });
  });
</script>

</body>
</html>
